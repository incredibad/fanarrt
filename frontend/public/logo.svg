<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" fill="#4f46e5"/>

  <!-- Image / picture frame — landscape rectangle -->
  <rect x="13" y="28" width="74" height="52" rx="8" fill="#3730a3"/>

  <!-- Stylised landscape inside frame: two hills + sky -->
  <!-- Sky band -->
  <rect x="13" y="28" width="74" height="24" rx="0" fill="#4338ca"/>
  <rect x="13" y="28" width="74" height="8"  rx="0" fill="#4f46e5" opacity="0.4"/>

  <!-- Clip to frame bounds -->
  <defs>
    <clipPath id="c"><rect x="13" y="28" width="74" height="52" rx="8"/></clipPath>
  </defs>

  <!-- Left hill -->
  <ellipse cx="32" cy="82" rx="28" ry="22" fill="#6d28d9" clip-path="url(#c)"/>
  <!-- Right hill -->
  <ellipse cx="72" cy="86" rx="30" ry="20" fill="#5b21b6" clip-path="url(#c)"/>

  <!-- Frame border -->
  <rect x="13" y="28" width="74" height="52" rx="8" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>

  <!-- Star — overlaps top of frame, centred -->
  <polygon
    points="50,11  53.5,21.5  65,21.5  55.8,28  59,38.5  50,32  41,38.5  44.2,28  35,21.5  46.5,21.5"
    fill="#fbbf24"
    stroke="#d97706"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Small sparkle dots (top-right of frame) to suggest 'art' -->
  <circle cx="76" cy="38" r="2.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="83" cy="33" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="80" cy="44" r="1.2" fill="rgba(255,255,255,0.3)"/>
</svg>
