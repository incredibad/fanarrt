<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>
  <!-- Picture frame -->
  <rect x="4" y="9" width="24" height="18" rx="3" fill="#3730a3"/>
  <!-- Hills in frame -->
  <ellipse cx="10" cy="30" rx="9" ry="7" fill="#6d28d9" clip-path="url(#fc)"/>
  <ellipse cx="23" cy="31" rx="10" ry="7" fill="#5b21b6" clip-path="url(#fc)"/>
  <defs><clipPath id="fc"><rect x="4" y="9" width="24" height="18" rx="3"/></clipPath></defs>
  <!-- Frame border -->
  <rect x="4" y="9" width="24" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Star -->
  <polygon points="16,3 17.5,8 23,8 18.5,11 20,16 16,13 12,16 13.5,11 9,8 14.5,8" fill="#fbbf24" stroke="#d97706" stroke-width="0.5" stroke-linejoin="round"/>
</svg>
