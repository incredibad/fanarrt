services:
  fanarrt:
    image: incredibad/fanarrt:latest
    container_name: fanarrt
    ports:
      - "3579:3579"
    volumes:
      - fanarrt-data:/app/data
      - fanarrt-downloads:/app/downloads
    environment:
      - PORT=3579
      # Uncomment if serving behind an HTTPS reverse proxy (Nginx, Caddy, Traefik).
      # Marks session cookies as Secure so they are never sent over plain HTTP.
      # - SECURE_COOKIES=1
    restart: unless-stopped

volumes:
  fanarrt-data:
  fanarrt-downloads:
