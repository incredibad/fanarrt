services:
  fanarrt:
    image: incredibad/fanarrt:latest
    container_name: fanarrt
    ports:
      - "3579:3579"
    volumes:
      - fanarrt-data:/app/data
      - fanarrt-downloads:/app/downloads
    environment:
      - PORT=3579
    restart: unless-stopped

volumes:
  fanarrt-data:
  fanarrt-downloads:
